services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hduhelp
      POSTGRES_USER: hduhelp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hduhelp -d hduhelp"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://hduhelp:${POSTGRES_PASSWORD}@db:5432/hduhelp?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: hduhelp-local
      JWT_AUDIENCE: hduhelp-web
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${HDUHELP_ADMIN_USERNAME:?Set HDUHELP_ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${HDUHELP_ADMIN_PASSWORD:?Set HDUHELP_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
